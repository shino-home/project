<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모여봐요 시노의 숲</title>
  <link rel="stylesheet" href="style.css">
</head>
<script src="script.js"></script>

<body>

  <!-- 메인 헤더 -->
  <header class="header">
    <h1>🚀 모여봐요 시노의 숲</h1>
    <p>이것저것 해볼라니까 천천히 기다려 보쇼.</p>
  </header>

  <main class="container">
    <!-- 상태 & 기술 스택 카드 -->
    <section class="card profile-card">
      <h2>📌 첫번째 한것</h2>
      <div class="tags">
        <span class="tag">1번버튼</span>
        <span class="tag">2번버튼</span>
        <span class="tag">3번버튼</span>
        <span class="tag">4번 버튼</span>
      </div>
      <p class="status-msg">이것도 한번 바꿔볼랍니다.</p>
    </section>

    <!-- 자바스크립트 목록 섹션 -->
    <section class="projects-section">
      <h2>🛠️ 프로젝트 섹션입니다<div class=""></div></h2>
      <div class="project-grid">

        <!-- 프로젝트 카드 1 -->
        <article class="project-card">
          <div class="card-badge">카드 밷지 입니다.</div>
          <h3>프로젝트 카드 안 제목입니다.</h3>
          <p>프로젝트 카드 안 내용입니다.</p>
          <a href="https://syonlab.github.io/wallet-keeper/" class="btn"target="_blank">버튼 클릭히히</a>
          
        </article>

<!-- 프로젝트 카드 2 (실시간 시계/D-Day 적용) -->
        <article class="project-card">
          <div class="card-badge">카드밷지2</div>
          <h3>프로젝트 카드 2번입니다.</h3>
          <p>프로젝트카드 2번 내용입니다.</p>
          
          <!-- 시계 및 D-Day가 들어갈 영역 -->
          <div class="clock-box">
            <div id="live-clock">00:00:00</div>
            <div id="d-day-count">위를 보시오</div>
          </div>

          <a href="https://syonlab.github.io/wallet-keeper/" class="btn">버튼클릭 히히 2</a>
        </article>

      </div>
    </section>
  </main>

  <footer>
    <p>이건 아래 달리는거야.</p>
  </footer>

</body>
</html>
